<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spool</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #15181b;
    --panel: #1e2226;
    --panel-raised: #24282c;
    --line: #32373b;
    --text: #ece7dd;
    --text-dim: #8b9094;
    --accent: #c9a227;
    --accent-dim: #8a721f;
    --rec: #c1443c;
    --rec-dim: #7a2b26;
    --radius: 3px;
    color-scheme: dark;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    overscroll-behavior-y: none;
  }

  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
  }

  .app {
    width: 100%;
    max-width: 520px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    position: relative;
  }

  /* ---------- header ---------- */
  header {
    padding: 18px 18px 14px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
  }

  .wordmark {
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 22px;
    letter-spacing: 0.03em;
    color: var(--text);
    display: flex;
    align-items: baseline;
    gap: 8px;
  }
  .wordmark .dot { color: var(--accent); font-size: 22px; line-height: 0; }

  .proj-btn {
    background: none;
    border: 1px solid var(--line);
    color: var(--text-dim);
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    padding: 7px 12px;
    border-radius: var(--radius);
    cursor: pointer;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .proj-btn:active { background: var(--panel-raised); }

  .proj-title {
    padding: 10px 18px 16px;
    font-family: 'Oswald', sans-serif;
    font-weight: 500;
    font-size: 17px;
    color: var(--text);
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .proj-title input {
    background: none;
    border: none;
    color: var(--text);
    font-family: 'Oswald', sans-serif;
    font-weight: 500;
    font-size: 17px;
    flex: 1;
    min-width: 0;
    outline: none;
  }
  .proj-meta {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    white-space: nowrap;
  }

  /* ---------- track list ---------- */
  main {
    flex: 1;
    padding: 10px 14px 130px;
  }

  .empty {
    padding: 60px 20px;
    text-align: center;
    color: var(--text-dim);
    font-size: 14px;
    line-height: 1.6;
  }
  .empty strong { color: var(--text); display: block; font-family: 'Oswald', sans-serif; font-size: 18px; font-weight: 500; margin-bottom: 8px; }

  .track {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 12px 14px;
    margin: 8px 0;
  }
  .track.recording { border-color: var(--rec); }

  .track-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 10px;
  }
  .track-name {
    font-family: 'Oswald', sans-serif;
    font-weight: 500;
    font-size: 15px;
    background: none;
    border: none;
    color: var(--text);
    outline: none;
    width: 60%;
    padding: 0;
  }
  .track-time {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--text-dim);
  }

  .track-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .ctrl-btn {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: var(--panel-raised);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    padding: 0;
  }
  .ctrl-btn:active { background: var(--line); }
  .ctrl-btn.play.playing { border-color: var(--accent); color: var(--accent); }
  .ctrl-btn.mute.muted { border-color: var(--text-dim); background: var(--line); color: var(--text-dim); }
  .ctrl-btn.rec-dot { border-color: var(--rec); }
  .ctrl-btn.rec-dot .dotsvg { fill: var(--rec); }
  .ctrl-btn.rec-dot.active { background: var(--rec); }
  .ctrl-btn.rec-dot.active .dotsvg { fill: var(--bg); }
  .ctrl-btn.del { border-color: transparent; background: none; color: var(--text-dim); width: 28px; height: 28px; }

  .vol-wrap { flex: 1; display: flex; align-items: center; }
  .vol-row {
    display: flex;
    align-items: center;
    margin-top: 10px;
  }
  input[type=range] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 3px;
    background: var(--line);
    border-radius: 2px;
    outline: none;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 15px;
    height: 15px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
    border: none;
  }
  input[type=range]::-moz-range-thumb {
    width: 15px;
    height: 15px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
    border: none;
  }

  .track-actions {
    display: flex;
    gap: 8px;
    margin-top: 14px;
  }

  .add-track {
    flex: 1;
    padding: 13px;
    border-radius: var(--radius);
    border: 1px dashed var(--line);
    background: none;
    color: var(--text-dim);
    font-family: 'Oswald', sans-serif;
    font-size: 14px;
    letter-spacing: 0.02em;
    cursor: pointer;
  }
  .add-track:active { border-color: var(--accent); color: var(--accent); }
  .add-track.recording {
    border: 1px solid var(--rec);
    color: var(--rec);
    border-style: solid;
  }

  .upload-track {
    flex: 1;
    padding: 13px;
    border-radius: var(--radius);
    border: 1px dashed var(--line);
    background: none;
    color: var(--text-dim);
    font-family: 'Oswald', sans-serif;
    font-size: 14px;
    letter-spacing: 0.02em;
    cursor: pointer;
  }
  .upload-track:active { border-color: var(--accent); color: var(--accent); }

  .hint {
    text-align: center;
    color: var(--text-dim);
    font-size: 12px;
    margin-top: 10px;
    line-height: 1.5;
    padding: 0 10px;
  }

  /* ---------- transport ---------- */
  .transport {
    position: fixed;
    left: 50%;
    transform: translateX(-50%);
    bottom: 0;
    width: 100%;
    max-width: 520px;
    background: var(--panel);
    border-top: 1px solid var(--line);
    padding: 12px 16px calc(14px + env(safe-area-inset-bottom));
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
  }
  .time-readout {
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    color: var(--accent);
    min-width: 46px;
  }
  .transport-btns { display: flex; gap: 10px; flex: 1; justify-content: flex-end; }
  .t-btn {
    border: 1px solid var(--line);
    background: var(--panel-raised);
    color: var(--text);
    font-family: 'Oswald', sans-serif;
    font-size: 14px;
    padding: 10px 18px;
    border-radius: var(--radius);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 7px;
  }
  .t-btn:active { background: var(--line); }
  .t-btn.play { border-color: var(--accent); color: var(--accent); }
  .t-btn.play.on { background: var(--accent); color: var(--bg); }
  .t-btn:disabled { opacity: 0.35; }

  /* ---------- modal ---------- */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(10,12,13,0.72);
    display: none;
    align-items: flex-end;
    justify-content: center;
    z-index: 50;
  }
  .overlay.show { display: flex; }
  .sheet {
    width: 100%;
    max-width: 520px;
    background: var(--panel);
    border-top: 1px solid var(--line);
    border-radius: 10px 10px 0 0;
    padding: 18px 18px calc(20px + env(safe-area-inset-bottom));
    max-height: 78vh;
    overflow-y: auto;
  }
  .sheet h2 {
    font-family: 'Oswald', sans-serif;
    font-weight: 500;
    font-size: 17px;
    margin: 0 0 14px;
  }
  .proj-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 4px;
    border-bottom: 1px solid var(--line);
    gap: 10px;
  }
  .proj-row:last-of-type { border-bottom: none; }
  .proj-row .p-name { font-size: 14px; color: var(--text); flex: 1; }
  .proj-row .p-meta { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-dim); }
  .proj-row .p-del { color: var(--text-dim); background: none; border: none; font-size: 18px; cursor: pointer; padding: 4px 8px; }
  .new-proj-btn {
    width: 100%;
    margin-top: 14px;
    padding: 12px;
    border-radius: var(--radius);
    border: 1px solid var(--accent);
    background: none;
    color: var(--accent);
    font-family: 'Oswald', sans-serif;
    font-size: 14px;
    cursor: pointer;
  }
  .close-sheet {
    display: block;
    width: 100%;
    text-align: center;
    margin-top: 16px;
    padding: 10px;
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 13px;
    cursor: pointer;
  }

  .status-msg {
    position: fixed;
    top: 14px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--panel-raised);
    border: 1px solid var(--line);
    color: var(--text);
    font-size: 13px;
    padding: 9px 16px;
    border-radius: var(--radius);
    z-index: 100;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
    max-width: 90%;
    text-align: center;
  }
  .status-msg.show { opacity: 1; }

  .wave-canvas {
    width: 100%;
    height: 90px;
    display: block;
    background: var(--panel-raised);
    border-radius: var(--radius);
    border: 1px solid var(--line);
    touch-action: none;
  }
  .trim-labels {
    display: flex;
    justify-content: space-between;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    margin: 8px 2px 12px;
  }
  .trim-labels #selDurLabel { color: var(--accent); }
  .trim-slider-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
  }
  .trim-tag {
    font-family: 'Oswald', sans-serif;
    font-size: 12px;
    color: var(--text-dim);
    width: 40px;
    flex-shrink: 0;
  }
  .edit-btn-row {
    display: flex;
    gap: 10px;
    margin-top: 4px;
  }
  .edit-btn-row .t-btn { flex: 1; justify-content: center; }
</style>
</head>
<body>
<div class="app">

  <header>
    <div class="wordmark">SPOOL<span class="dot">·</span></div>
    <button class="proj-btn" id="projectsBtn">Projects</button>
  </header>

  <div class="proj-title">
    <input id="projName" spellcheck="false" placeholder="Untitled session">
    <span class="proj-meta" id="trackCount">0 tracks</span>
    <button class="proj-btn" id="exportMixBtn" title="Export the full mix as a WAV file">⇩ Mix</button>
  </div>

  <main id="trackList"></main>
  <input type="file" id="fileInput" accept="audio/*" multiple style="display:none">

  <div class="transport">
    <div class="time-readout" id="timeReadout">0:00</div>
    <div class="transport-btns">
      <button class="t-btn" id="stopBtn" disabled>■ Stop</button>
      <button class="t-btn play" id="playAllBtn" disabled>▶ Play all</button>
    </div>
  </div>
</div>

<div class="overlay" id="projOverlay">
  <div class="sheet">
    <h2>Your sessions</h2>
    <div id="projList"></div>
    <button class="new-proj-btn" id="newProjBtn">+ New session</button>
    <button class="close-sheet" id="closeSheet">Close</button>
  </div>
</div>

<div class="overlay" id="editOverlay">
  <div class="sheet">
    <h2 id="editTitle">Edit track</h2>
    <canvas id="waveCanvas" class="wave-canvas" height="90"></canvas>
    <div class="trim-labels">
      <span id="startLabel">0:00</span>
      <span id="selDurLabel">0:00 selected</span>
      <span id="endLabel">0:00</span>
    </div>
    <div class="trim-slider-row">
      <span class="trim-tag">Start</span>
      <input type="range" id="startRange" min="0" max="1" step="0.01" value="0">
    </div>
    <div class="trim-slider-row">
      <span class="trim-tag">End</span>
      <input type="range" id="endRange" min="0" max="1" step="0.01" value="1">
    </div>
    <div class="edit-btn-row">
      <button class="t-btn" id="previewCropBtn">▶ Preview</button>
      <button class="t-btn" id="resetCropBtn">Reset</button>
    </div>
    <button class="new-proj-btn" id="applyCropBtn">Apply crop</button>
    <button class="close-sheet" id="closeEditSheet">Cancel</button>
  </div>
</div>

<div class="status-msg" id="statusMsg"></div>

<script>
(function(){
  "use strict";

  // ---------- storage (IndexedDB) ----------
  const DB_NAME = "spool-db";
  const DB_VERSION = 1;
  let db;

  function openDB(){
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = (e) => {
        const _db = e.target.result;
        if (!_db.objectStoreNames.contains("projects")) {
          _db.createObjectStore("projects", { keyPath: "id" });
        }
      };
      req.onsuccess = (e) => resolve(e.target.result);
      req.onerror = (e) => reject(e.target.error);
    });
  }

  function idbGetAll(){
    return new Promise((resolve, reject) => {
      const tx = db.transaction("projects", "readonly");
      const store = tx.objectStore("projects");
      const req = store.getAll();
      req.onsuccess = () => resolve(req.result || []);
      req.onerror = () => reject(req.error);
    });
  }

  function idbPut(project){
    return new Promise((resolve, reject) => {
      const tx = db.transaction("projects", "readwrite");
      tx.objectStore("projects").put(project);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }

  function idbDelete(id){
    return new Promise((resolve, reject) => {
      const tx = db.transaction("projects", "readwrite");
      tx.objectStore("projects").delete(id);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }

  // ---------- state ----------
  let currentProject = null;   // { id, name, createdAt, tracks: [...] }
  let audioCtx = null;
  let mediaStream = null;
  let mediaRecorder = null;
  let recordChunks = [];
  let recordingTrackId = null;
  let decodedCache = new Map(); // trackId -> AudioBuffer
  let activeSources = [];       // currently playing AudioBufferSourceNodes
  let playAllTimer = null;
  let soloSingleTrackId = null; // when playing a single track via its own play button
  let editingTrack = null;
  let editingBuffer = null;
  let editingPeaks = null;
  let editStart = 0;
  let editEnd = 0;
  let editPreviewSource = null;
  let editPreviewTimer = null;

  const trackListEl = document.getElementById("trackList");
  const projNameEl = document.getElementById("projName");
  const trackCountEl = document.getElementById("trackCount");
  const playAllBtn = document.getElementById("playAllBtn");
  const stopBtn = document.getElementById("stopBtn");
  const timeReadout = document.getElementById("timeReadout");
  const statusMsg = document.getElementById("statusMsg");
  const fileInputEl = document.getElementById("fileInput");

  function showStatus(text, ms){
    statusMsg.textContent = text;
    statusMsg.classList.add("show");
    clearTimeout(showStatus._t);
    showStatus._t = setTimeout(() => statusMsg.classList.remove("show"), ms || 2200);
  }

  function fmtTime(sec){
    sec = Math.max(0, Math.round(sec || 0));
    const m = Math.floor(sec / 60);
    const s = sec % 60;
    return m + ":" + String(s).padStart(2, "0");
  }

  function uid(){
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  function getAudioCtx(){
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === "suspended") audioCtx.resume();
    return audioCtx;
  }

  // ---------- project lifecycle ----------
  async function createProject(name){
    const p = { id: uid(), name: name || "Untitled session", createdAt: Date.now(), tracks: [] };
    await idbPut(p);
    localStorage.setItem("spool-last-project", p.id);
    currentProject = p;
    decodedCache.clear();
    renderProject();
  }

  async function loadProject(id){
    const all = await idbGetAll();
    const p = all.find(x => x.id === id);
    if (p) {
      currentProject = p;
      localStorage.setItem("spool-last-project", p.id);
      decodedCache.clear();
      renderProject();
    }
  }

  async function saveCurrentProject(){
    if (!currentProject) return;
    await idbPut(currentProject);
  }

  async function initApp(){
    db = await openDB();
    const all = await idbGetAll();
    const lastId = localStorage.getItem("spool-last-project");
    let toLoad = null;
    if (lastId) toLoad = all.find(p => p.id === lastId);
    if (!toLoad && all.length) toLoad = all.slice().sort((a,b) => b.createdAt - a.createdAt)[0];
    if (toLoad) {
      currentProject = toLoad;
      renderProject();
    } else {
      await createProject("My first session");
    }
  }

  // ---------- rendering ----------
  function renderProject(){
    projNameEl.value = currentProject.name;
    trackCountEl.textContent = currentProject.tracks.length + (currentProject.tracks.length === 1 ? " track" : " tracks");
    renderTracks();
    updateTransportState();
  }

  function renderTracks(){
    trackListEl.innerHTML = "";

    if (currentProject.tracks.length === 0) {
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.innerHTML = "<strong>No tracks yet</strong>Hit record below to lay down your first layer.<br>Headphones recommended once you start stacking takes.";
      trackListEl.appendChild(empty);
    } else {
      currentProject.tracks.forEach(t => trackListEl.appendChild(buildTrackRow(t)));
    }

    const actions = document.createElement("div");
    actions.className = "track-actions";

    const addBtn = document.createElement("button");
    addBtn.className = "add-track";
    addBtn.id = "addTrackBtn";
    addBtn.textContent = recordingTrackId ? "● Recording — tap to stop" : "● Record new track";
    if (recordingTrackId) addBtn.classList.add("recording");
    addBtn.addEventListener("click", onAddTrackTap);
    actions.appendChild(addBtn);

    const uploadBtn = document.createElement("button");
    uploadBtn.className = "upload-track";
    uploadBtn.textContent = "⇪ Upload file";
    uploadBtn.disabled = !!recordingTrackId;
    uploadBtn.addEventListener("click", () => fileInputEl.click());
    actions.appendChild(uploadBtn);

    trackListEl.appendChild(actions);

    const hint = document.createElement("div");
    hint.className = "hint";
    hint.textContent = currentProject.tracks.length
      ? "Recording a new track plays back your existing tracks so you can play along."
      : "Your first take sets the length — everything after layers on top of it. You can also upload an existing audio file instead of recording.";
    trackListEl.appendChild(hint);
  }

  function buildTrackRow(t){
    const row = document.createElement("div");
    row.className = "track" + (t.id === recordingTrackId ? " recording" : "");
    row.dataset.id = t.id;

    const top = document.createElement("div");
    top.className = "track-top";

    const nameInput = document.createElement("input");
    nameInput.className = "track-name";
    nameInput.value = t.name;
    nameInput.spellcheck = false;
    nameInput.addEventListener("change", () => {
      t.name = nameInput.value || "Track";
      saveCurrentProject();
    });

    const timeEl = document.createElement("span");
    timeEl.className = "track-time";
    timeEl.textContent = t.id === recordingTrackId ? "rec…" : fmtTime(t.duration);

    top.appendChild(nameInput);
    top.appendChild(timeEl);

    const controls = document.createElement("div");
    controls.className = "track-row";

    const playBtn = document.createElement("button");
    playBtn.className = "ctrl-btn play";
    playBtn.innerHTML = svgPlay();
    playBtn.title = "Preview this track alone";
    playBtn.addEventListener("click", () => toggleSoloPlay(t.id, playBtn));

    const muteBtn = document.createElement("button");
    muteBtn.className = "ctrl-btn mute" + (t.muted ? " muted" : "");
    muteBtn.innerHTML = t.muted ? svgMuted() : svgVol();
    muteBtn.addEventListener("click", () => {
      t.muted = !t.muted;
      muteBtn.classList.toggle("muted", t.muted);
      muteBtn.innerHTML = t.muted ? svgMuted() : svgVol();
      saveCurrentProject();
    });

    const editBtn = document.createElement("button");
    editBtn.className = "ctrl-btn edit";
    editBtn.innerHTML = svgEdit();
    editBtn.title = "Crop / edit";
    editBtn.addEventListener("click", () => openEditSheet(t.id));

    const exportBtn = document.createElement("button");
    exportBtn.className = "ctrl-btn export";
    exportBtn.innerHTML = svgDownload();
    exportBtn.title = "Export this track";
    exportBtn.addEventListener("click", () => exportTrack(t));

    const delBtn = document.createElement("button");
    delBtn.className = "ctrl-btn del";
    delBtn.innerHTML = svgTrash();
    delBtn.addEventListener("click", () => deleteTrack(t.id));

    controls.appendChild(playBtn);
    controls.appendChild(muteBtn);
    controls.appendChild(editBtn);
    controls.appendChild(exportBtn);
    controls.appendChild(delBtn);

    const volRow = document.createElement("div");
    volRow.className = "vol-row";
    const volWrap = document.createElement("div");
    volWrap.className = "vol-wrap";
    const vol = document.createElement("input");
    vol.type = "range";
    vol.min = "0";
    vol.max = "1";
    vol.step = "0.01";
    vol.value = t.volume;
    vol.addEventListener("input", () => {
      t.volume = parseFloat(vol.value);
    });
    vol.addEventListener("change", () => saveCurrentProject());
    volWrap.appendChild(vol);
    volRow.appendChild(volWrap);

    row.appendChild(top);
    row.appendChild(controls);
    row.appendChild(volRow);
    return row;
  }

  // ---------- icons ----------
  function svgPlay(){ return '<svg width="13" height="13" viewBox="0 0 24 24"><path d="M6 4l15 8-15 8z" fill="currentColor"/></svg>'; }
  function svgStop(){ return '<svg width="12" height="12" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" fill="currentColor"/></svg>'; }
  function svgVol(){ return '<svg width="15" height="15" viewBox="0 0 24 24"><path d="M4 9v6h4l5 5V4L8 9H4z" fill="currentColor"/></svg>'; }
  function svgMuted(){ return '<svg width="15" height="15" viewBox="0 0 24 24"><path d="M4 9v6h4l5 5V4L8 9H4z" fill="currentColor"/><line x1="16" y1="9" x2="22" y2="15" stroke="currentColor" stroke-width="2"/><line x1="22" y1="9" x2="16" y2="15" stroke="currentColor" stroke-width="2"/></svg>'; }
  function svgTrash(){ return '<svg width="14" height="14" viewBox="0 0 24 24"><path d="M6 7h12M9 7V4h6v3M7 7l1 13h8l1-13" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>'; }
  function svgEdit(){ return '<svg width="14" height="14" viewBox="0 0 24 24"><path d="M4 20l4.3-.9L19.1 8.3a1.5 1.5 0 000-2.1l-1.3-1.3a1.5 1.5 0 00-2.1 0L4.9 15.7 4 20z" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linejoin="round"/></svg>'; }
  function svgDownload(){ return '<svg width="14" height="14" viewBox="0 0 24 24"><path d="M12 4v11m0 0l-4-4m4 4l4-4M5 19h14" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>'; }
  function svgDot(){ return '<svg class="dotsvg" width="12" height="12" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/></svg>'; }

  // ---------- recording ----------
  async function onAddTrackTap(){
    if (recordingTrackId) {
      stopRecording();
      return;
    }
    try {
      mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch (err) {
      showStatus("Couldn't access the microphone — check permissions.", 3200);
      return;
    }

    const mimeType = pickMimeType();
    mediaRecorder = new MediaRecorder(mediaStream, mimeType ? { mimeType } : undefined);
    recordChunks = [];
    recordingTrackId = "pending";

    mediaRecorder.ondataavailable = (e) => { if (e.data && e.data.size) recordChunks.push(e.data); };
    mediaRecorder.onstop = onRecordingStopped;

    // play existing tracks underneath so the user can layer in time
    stopAllPlayback();
    if (currentProject.tracks.length) {
      playTracksInternal(currentProject.tracks, { forMonitoring: true });
    }

    mediaRecorder.start();
    renderTracks();
    showStatus("Recording…", 1400);
  }

  function pickMimeType(){
    const candidates = [
      "audio/webm;codecs=opus",
      "audio/webm",
      "audio/mp4",
      "audio/ogg;codecs=opus"
    ];
    for (const c of candidates) {
      if (window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(c)) return c;
    }
    return "";
  }

  function stopRecording(){
    if (mediaRecorder && mediaRecorder.state !== "inactive") {
      mediaRecorder.stop();
    }
    stopAllPlayback();
    if (mediaStream) {
      mediaStream.getTracks().forEach(tr => tr.stop());
      mediaStream = null;
    }
  }

  async function onRecordingStopped(){
    const blob = new Blob(recordChunks, { type: mediaRecorder.mimeType || "audio/webm" });
    recordChunks = [];
    recordingTrackId = null;

    if (blob.size < 300) {
      showStatus("That take was too short — nothing saved.", 2600);
      renderTracks();
      return;
    }

    let duration = 0;
    try {
      const buf = await blob.arrayBuffer();
      const audioBuffer = await getAudioCtx().decodeAudioData(buf.slice(0));
      duration = audioBuffer.duration;
      const track = {
        id: uid(),
        name: "Take " + (currentProject.tracks.length + 1),
        blob: blob,
        duration: duration,
        volume: 1,
        muted: false
      };
      decodedCache.set(track.id, audioBuffer);
      currentProject.tracks.push(track);
      await saveCurrentProject();
      renderProject();
      showStatus("Track saved.", 1600);
    } catch (err) {
      showStatus("Couldn't process that recording — try again.", 2800);
      renderTracks();
    }
  }

  async function handleFileUpload(fileList){
    const files = Array.from(fileList || []);
    if (!files.length) return;

    for (const file of files) {
      try {
        const buf = await file.arrayBuffer();
        const audioBuffer = await getAudioCtx().decodeAudioData(buf.slice(0));
        const cleanName = file.name.replace(/\.[^/.]+$/, "");
        const track = {
          id: uid(),
          name: cleanName || "Uploaded track",
          blob: file,
          duration: audioBuffer.duration,
          volume: 1,
          muted: false
        };
        decodedCache.set(track.id, audioBuffer);
        currentProject.tracks.push(track);
      } catch (err) {
        showStatus('Couldn\'t read "' + file.name + '" as audio — skipped.', 2800);
      }
    }
    await saveCurrentProject();
    renderProject();
  }

  fileInputEl.addEventListener("change", (e) => {
    handleFileUpload(e.target.files);
    e.target.value = "";
  });

  async function deleteTrack(id){
    currentProject.tracks = currentProject.tracks.filter(t => t.id !== id);
    decodedCache.delete(id);
    await saveCurrentProject();
    renderProject();
  }

  // ---------- decoding ----------
  async function ensureDecoded(track){
    if (decodedCache.has(track.id)) return decodedCache.get(track.id);
    const buf = await track.blob.arrayBuffer();
    const audioBuffer = await getAudioCtx().decodeAudioData(buf.slice(0));
    decodedCache.set(track.id, audioBuffer);
    return audioBuffer;
  }

  // ---------- playback ----------
  function stopAllPlayback(){
    activeSources.forEach(s => { try { s.stop(); } catch(e){} });
    activeSources = [];
    clearInterval(playAllTimer);
    playAllTimer = null;
    playAllBtn.classList.remove("on");
    playAllBtn.textContent = "▶ Play all";
    stopBtn.disabled = true;
    playAllBtn.disabled = currentProject.tracks.length === 0;
    timeReadout.textContent = "0:00";
    soloSingleTrackId = null;
    document.querySelectorAll(".ctrl-btn.play.playing").forEach(b => {
      b.classList.remove("playing");
      b.innerHTML = svgPlay();
    });
  }

  async function playTracksInternal(tracks, opts){
    opts = opts || {};
    const ctx = getAudioCtx();
    const startAt = ctx.currentTime + 0.05;
    let maxDur = 0;

    for (const t of tracks) {
      if (!opts.forMonitoring && t.muted) continue;
      let buffer;
      try { buffer = await ensureDecoded(t); } catch (e) { continue; }
      const src = ctx.createBufferSource();
      src.buffer = buffer;
      const gain = ctx.createGain();
      gain.gain.value = opts.forMonitoring ? (t.muted ? 0 : t.volume) : t.volume;
      src.connect(gain).connect(ctx.destination);
      src.start(startAt);
      activeSources.push(src);
      maxDur = Math.max(maxDur, buffer.duration);
    }
    return maxDur;
  }

  async function playAll(){
    if (!currentProject.tracks.length) return;
    stopAllPlayback();
    const dur = await playTracksInternal(currentProject.tracks, {});
    playAllBtn.classList.add("on");
    playAllBtn.textContent = "● Playing";
    stopBtn.disabled = false;
    const startedAt = performance.now();
    playAllTimer = setInterval(() => {
      const elapsed = (performance.now() - startedAt) / 1000;
      timeReadout.textContent = fmtTime(elapsed);
      if (elapsed >= dur) stopAllPlayback();
    }, 200);
  }

  async function toggleSoloPlay(trackId, btnEl){
    const isPlayingThis = soloSingleTrackId === trackId;
    stopAllPlayback();
    if (isPlayingThis) return;

    const t = currentProject.tracks.find(x => x.id === trackId);
    if (!t) return;
    soloSingleTrackId = trackId;
    btnEl.classList.add("playing");
    btnEl.innerHTML = svgStop();
    stopBtn.disabled = false;

    const dur = await playTracksInternal([t], { forMonitoring: true });
    const startedAt = performance.now();
    playAllTimer = setInterval(() => {
      const elapsed = (performance.now() - startedAt) / 1000;
      timeReadout.textContent = fmtTime(elapsed);
      if (elapsed >= dur) stopAllPlayback();
    }, 200);
  }

  function updateTransportState(){
    playAllBtn.disabled = currentProject.tracks.length === 0;
  }

  // ---------- track editing (crop) ----------
  const editOverlay = document.getElementById("editOverlay");
  const waveCanvas = document.getElementById("waveCanvas");
  const startRangeEl = document.getElementById("startRange");
  const endRangeEl = document.getElementById("endRange");
  const previewCropBtn = document.getElementById("previewCropBtn");

  function fmtTimeMs(sec){
    sec = Math.max(0, sec || 0);
    const m = Math.floor(sec / 60);
    const s = sec - m * 60;
    return m + ":" + s.toFixed(1).padStart(4, "0");
  }

  function computePeaks(buffer, bins){
    const data = buffer.getChannelData(0);
    const samples = data.length;
    const step = Math.max(1, Math.floor(samples / bins));
    const peaks = [];
    for (let i = 0; i < bins; i++) {
      const start = i * step;
      const end = Math.min(samples, start + step);
      let min = 0, max = 0;
      for (let j = start; j < end; j++) {
        const v = data[j];
        if (v < min) min = v;
        if (v > max) max = v;
      }
      peaks.push([min, max]);
    }
    return peaks;
  }

  async function openEditSheet(trackId){
    const t = currentProject.tracks.find(x => x.id === trackId);
    if (!t) return;
    stopAllPlayback();
    let buffer;
    try { buffer = await ensureDecoded(t); }
    catch (e) { showStatus("Couldn't load that track for editing.", 2600); return; }

    editingTrack = t;
    editingBuffer = buffer;
    editingPeaks = computePeaks(buffer, 300);
    editStart = 0;
    editEnd = buffer.duration;

    document.getElementById("editTitle").textContent = "Edit: " + t.name;
    startRangeEl.min = 0; startRangeEl.max = buffer.duration; startRangeEl.step = 0.01; startRangeEl.value = 0;
    endRangeEl.min = 0; endRangeEl.max = buffer.duration; endRangeEl.step = 0.01; endRangeEl.value = buffer.duration;
    updateTrimLabels();
    drawWaveform();
    editOverlay.classList.add("show");
  }

  function closeEditSheetFn(){
    stopEditPreview();
    editOverlay.classList.remove("show");
    editingTrack = null;
    editingBuffer = null;
    editingPeaks = null;
  }

  function updateTrimLabels(){
    document.getElementById("startLabel").textContent = fmtTimeMs(editStart);
    document.getElementById("endLabel").textContent = fmtTimeMs(editEnd);
    document.getElementById("selDurLabel").textContent = fmtTimeMs(Math.max(0, editEnd - editStart)) + " selected";
  }

  function drawWaveform(){
    if (!editingPeaks) return;
    const dpr = window.devicePixelRatio || 1;
    const rect = waveCanvas.getBoundingClientRect();
    const w = rect.width || 300;
    const h = 90;
    waveCanvas.width = w * dpr;
    waveCanvas.height = h * dpr;
    const ctx = waveCanvas.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);

    const styles = getComputedStyle(document.documentElement);
    const accent = styles.getPropertyValue("--accent").trim();
    const dim = styles.getPropertyValue("--text-dim").trim();
    const mid = h / 2;
    const bins = editingPeaks.length;
    const binW = w / bins;

    for (let i = 0; i < bins; i++) {
      const x = i * binW;
      const t0 = (i / bins) * editingBuffer.duration;
      const inSel = t0 >= editStart && t0 <= editEnd;
      const [min, max] = editingPeaks[i];
      ctx.strokeStyle = inSel ? accent : dim;
      ctx.globalAlpha = inSel ? 1 : 0.35;
      ctx.lineWidth = Math.max(1, binW * 0.8);
      ctx.beginPath();
      ctx.moveTo(x + binW / 2, mid + min * mid * 0.9);
      ctx.lineTo(x + binW / 2, mid + max * mid * 0.9);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  startRangeEl.addEventListener("input", () => {
    let v = parseFloat(startRangeEl.value);
    const endV = parseFloat(endRangeEl.value);
    if (v > endV - 0.05) v = Math.max(0, endV - 0.05);
    startRangeEl.value = v;
    editStart = v;
    stopEditPreview();
    updateTrimLabels();
    drawWaveform();
  });

  endRangeEl.addEventListener("input", () => {
    let v = parseFloat(endRangeEl.value);
    const startV = parseFloat(startRangeEl.value);
    if (v < startV + 0.05) v = Math.min(editingBuffer.duration, startV + 0.05);
    endRangeEl.value = v;
    editEnd = v;
    stopEditPreview();
    updateTrimLabels();
    drawWaveform();
  });

  function stopEditPreview(){
    if (editPreviewSource) { try { editPreviewSource.stop(); } catch(e){} editPreviewSource = null; }
    clearTimeout(editPreviewTimer);
    previewCropBtn.textContent = "▶ Preview";
  }

  previewCropBtn.addEventListener("click", () => {
    if (editPreviewSource) { stopEditPreview(); return; }
    const ctx = getAudioCtx();
    const src = ctx.createBufferSource();
    src.buffer = editingBuffer;
    src.connect(ctx.destination);
    const dur = Math.max(0, editEnd - editStart);
    src.start(ctx.currentTime, editStart, dur);
    editPreviewSource = src;
    previewCropBtn.textContent = "■ Stop";
    src.onended = () => { editPreviewSource = null; previewCropBtn.textContent = "▶ Preview"; };
    editPreviewTimer = setTimeout(stopEditPreview, dur * 1000 + 100);
  });

  document.getElementById("resetCropBtn").addEventListener("click", () => {
    stopEditPreview();
    editStart = 0;
    editEnd = editingBuffer.duration;
    startRangeEl.value = 0;
    endRangeEl.value = editEnd;
    updateTrimLabels();
    drawWaveform();
  });

  document.getElementById("applyCropBtn").addEventListener("click", applyCrop);
  document.getElementById("closeEditSheet").addEventListener("click", closeEditSheetFn);

  async function applyCrop(){
    if (!editingTrack || !editingBuffer) return;
    const sr = editingBuffer.sampleRate;
    const chCount = editingBuffer.numberOfChannels;
    const startSample = Math.floor(editStart * sr);
    const endSample = Math.min(editingBuffer.length, Math.floor(editEnd * sr));
    const frameCount = Math.max(1, endSample - startSample);

    if (frameCount < sr * 0.05) { showStatus("Selection is too short.", 2200); return; }

    const newBuffer = getAudioCtx().createBuffer(chCount, frameCount, sr);
    for (let c = 0; c < chCount; c++) {
      const oldData = editingBuffer.getChannelData(c);
      const newData = newBuffer.getChannelData(c);
      newData.set(oldData.subarray(startSample, startSample + frameCount));
    }

    const wavBlob = encodeWav(newBuffer);
    const track = editingTrack;
    track.blob = wavBlob;
    track.duration = newBuffer.duration;
    decodedCache.set(track.id, newBuffer);

    await saveCurrentProject();
    closeEditSheetFn();
    renderProject();
    showStatus("Track cropped.", 1800);
  }

  function encodeWav(buffer){
    const numChannels = buffer.numberOfChannels;
    const sampleRate = buffer.sampleRate;
    const numFrames = buffer.length;
    const blockAlign = numChannels * 2;
    const dataSize = numFrames * blockAlign;
    const arr = new ArrayBuffer(44 + dataSize);
    const view = new DataView(arr);

    writeStr(view, 0, "RIFF");
    view.setUint32(4, 36 + dataSize, true);
    writeStr(view, 8, "WAVE");
    writeStr(view, 12, "fmt ");
    view.setUint32(16, 16, true);
    view.setUint16(20, 1, true);
    view.setUint16(22, numChannels, true);
    view.setUint32(24, sampleRate, true);
    view.setUint32(28, sampleRate * blockAlign, true);
    view.setUint16(32, blockAlign, true);
    view.setUint16(34, 16, true);
    writeStr(view, 36, "data");
    view.setUint32(40, dataSize, true);

    const channels = [];
    for (let c = 0; c < numChannels; c++) channels.push(buffer.getChannelData(c));
    let offset = 44;
    for (let i = 0; i < numFrames; i++) {
      for (let c = 0; c < numChannels; c++) {
        let sample = Math.max(-1, Math.min(1, channels[c][i]));
        sample = sample < 0 ? sample * 0x8000 : sample * 0x7fff;
        view.setInt16(offset, sample, true);
        offset += 2;
      }
    }
    return new Blob([arr], { type: "audio/wav" });
  }

  function writeStr(view, offset, str){
    for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
  }

  // ---------- exporting ----------
  function sanitizeFilename(name){
    return (name || "track").replace(/[\\/:*?"<>|]/g, "").trim().slice(0, 80) || "track";
  }

  function guessExtension(blob){
    const type = (blob.type || "").toLowerCase();
    if (type.includes("wav")) return "wav";
    if (type.includes("webm")) return "webm";
    if (type.includes("mp4") || type.includes("m4a")) return "m4a";
    if (type.includes("ogg")) return "ogg";
    if (type.includes("mpeg") || type.includes("mp3")) return "mp3";
    return "webm";
  }

  // Saves a Blob to the viewer's device. Uses the Claude artifact "downloads"
  // capability when running inside claude.ai; falls back to a plain browser
  // download (e.g. when this page is hosted elsewhere, like GitHub Pages).
  async function saveFile(filename, blob){
    if (window.claude && typeof window.claude.use === "function") {
      try {
        const downloads = await window.claude.use("downloads");
        if (downloads) {
          try {
            await downloads.save({ filename, data: blob });
            showStatus("Saved " + filename, 2000);
            return;
          } catch (err) {
            if (err && err.code === "declined") return;
            showStatus("Couldn't save that file here.", 2600);
            return;
          }
        }
      } catch (e) {
        // fall through to the plain browser download below
      }
    }

    try {
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      showStatus("Downloading " + filename, 1800);
    } catch (e2) {
      showStatus("Couldn't export this file.", 2600);
    }
  }

  async function exportTrack(t){
    const ext = guessExtension(t.blob);
    const filename = sanitizeFilename(t.name) + "." + ext;
    await saveFile(filename, t.blob);
  }

  async function exportMix(){
    if (!currentProject.tracks.length) { showStatus("No tracks to export yet.", 2200); return; }
    stopAllPlayback();
    showStatus("Rendering mix…", 3000);

    try {
      const included = [];
      let maxDur = 0, maxChannels = 1;
      for (const t of currentProject.tracks) {
        if (t.muted) continue;
        const buf = await ensureDecoded(t);
        included.push({ buf, volume: t.volume });
        maxDur = Math.max(maxDur, buf.duration);
        maxChannels = Math.max(maxChannels, buf.numberOfChannels);
      }
      if (!included.length) { showStatus("Every track is muted — nothing to export.", 2600); return; }

      const sampleRate = Math.max.apply(null, included.map(b => b.buf.sampleRate));
      const frameCount = Math.max(1, Math.ceil(maxDur * sampleRate) + 1);
      const offlineCtx = new OfflineAudioContext(maxChannels, frameCount, sampleRate);

      included.forEach(({ buf, volume }) => {
        const src = offlineCtx.createBufferSource();
        src.buffer = buf;
        const gain = offlineCtx.createGain();
        gain.gain.value = volume;
        src.connect(gain).connect(offlineCtx.destination);
        src.start(0);
      });

      const rendered = await offlineCtx.startRendering();
      const wavBlob = encodeWav(rendered);
      const filename = sanitizeFilename(currentProject.name || "mix") + " - mix.wav";
      await saveFile(filename, wavBlob);
    } catch (err) {
      showStatus("Couldn't render the mix.", 2800);
    }
  }

  document.getElementById("exportMixBtn").addEventListener("click", exportMix);

  // ---------- projects sheet ----------
  const overlay = document.getElementById("projOverlay");
  const projListEl = document.getElementById("projList");

  async function openProjectsSheet(){
    const all = (await idbGetAll()).sort((a,b) => b.createdAt - a.createdAt);
    projListEl.innerHTML = "";
    if (!all.length) {
      projListEl.innerHTML = '<div class="hint">No sessions yet.</div>';
    }
    all.forEach(p => {
      const row = document.createElement("div");
      row.className = "proj-row";
      const nameSpan = document.createElement("span");
      nameSpan.className = "p-name";
      nameSpan.textContent = p.name + (p.id === currentProject.id ? "  ·  current" : "");
      nameSpan.addEventListener("click", async () => {
        overlay.classList.remove("show");
        stopAllPlayback();
        if (p.id !== currentProject.id) await loadProject(p.id);
      });
      const meta = document.createElement("span");
      meta.className = "p-meta";
      meta.textContent = p.tracks.length + " trk";
      const del = document.createElement("button");
      del.className = "p-del";
      del.textContent = "×";
      del.addEventListener("click", async (e) => {
        e.stopPropagation();
        if (all.length === 1) { showStatus("You need at least one session.", 2200); return; }
        await idbDelete(p.id);
        if (p.id === currentProject.id) {
          const remaining = (await idbGetAll()).sort((a,b) => b.createdAt - a.createdAt);
          currentProject = remaining[0];
          localStorage.setItem("spool-last-project", currentProject.id);
          decodedCache.clear();
          renderProject();
        }
        openProjectsSheet();
      });
      row.appendChild(nameSpan);
      row.appendChild(meta);
      row.appendChild(del);
      projListEl.appendChild(row);
    });
    overlay.classList.add("show");
  }

  document.getElementById("projectsBtn").addEventListener("click", openProjectsSheet);
  document.getElementById("closeSheet").addEventListener("click", () => overlay.classList.remove("show"));
  document.getElementById("newProjBtn").addEventListener("click", async () => {
    overlay.classList.remove("show");
    stopAllPlayback();
    await createProject("Untitled session");
  });

  projNameEl.addEventListener("change", () => {
    currentProject.name = projNameEl.value || "Untitled session";
    saveCurrentProject();
  });

  playAllBtn.addEventListener("click", () => {
    if (playAllBtn.classList.contains("on") || soloSingleTrackId) { stopAllPlayback(); }
    else { playAll(); }
  });
  stopBtn.addEventListener("click", () => {
    stopAllPlayback();
    if (recordingTrackId) stopRecording();
  });

  window.addEventListener("beforeunload", () => {
    if (mediaStream) mediaStream.getTracks().forEach(t => t.stop());
  });

  initApp();
})();
</script>
